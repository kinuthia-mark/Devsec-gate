name: DevSecOps Security Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  policy-tests:
    name: OPA policy unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: latest

      - name: Check Rego syntax and formatting
        run: |
          opa check policies/
          opa fmt --fail --list policies/

      - name: Run policy tests
        run: opa test policies/ -v

  iac-scan:
    name: Terraform lint and Checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v4

      - name: terraform fmt and validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

      - uses: terraform-linters/setup-tflint@v6

      - name: TFLint
        run: |
          tflint --init --config="$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --chdir=terraform --config="$GITHUB_WORKSPACE/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checkov
        run: |
          pip install checkov
          checkov --config-file .checkov.yaml

  container-scan:
    name: Build and scan the container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t devsecops-gateway:${{ github.sha }} ./app

      - name: Trivy scan (fails on fixable HIGH or CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devsecops-gateway:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  security-gate:
    name: Exploitability gate
    runs-on: ubuntu-latest
    needs: policy-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up OPA
        uses: open-policy-agent/setup-opa@v2
        with:
          version: latest

      # The clean fixture must pass. This is the gate decision a real
      # pipeline would act on, with the scanner output swapped in.
      - name: Gate passes on the clean scan
        run: python3 scripts/process-results.py fixtures/scan-clean.json

      # The blocked fixture holds an unmitigated, actively exploited CRITICAL.
      # The job fails if the gate ever lets it through.
      - name: Gate blocks the scan with an exploitable CRITICAL
        env:
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_USER: ${{ secrets.JIRA_USER }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
        run: |
          if python3 scripts/process-results.py fixtures/scan-blocked.json; then
            echo "::error::The gate let an exploitable CRITICAL through"
            exit 1
          fi
          echo "Gate blocked the build as expected."

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-gate-report
          path: scan-results/
          retention-days: 30
